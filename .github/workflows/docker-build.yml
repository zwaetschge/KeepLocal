name: Docker Build and Push

# Bilder werden erst veroeffentlicht, NACHDEM die CI fuer denselben Commit gruen
# ist. Vorher lief dieser Workflow parallel zur CI: Ein roter Test auf main hat
# `latest` nicht aufgehalten - genau das Image, das Self-Hoster pullen.
#   - workflow_run: startet nach Abschluss des CI-Workflows (nur push auf main,
#     nur bei conclusion=success, siehe `if` am Job).
#   - push tags: Release-Tags werden aus einem gruenen main geschnitten; fuer
#     Tags laeuft keine CI, deshalb bleibt der direkte Weg.
#   - workflow_dispatch auf main: manueller Release, ebenfalls ohne CI-Gate.
#   - workflow_dispatch auf einem Branch (Top-30 Nr. 29): Verifikations-Build —
#     docker-metadata.sh publisht dann NUR den immutablen Tag (nie main/latest),
#     damit Dockerfile-Änderungen vor dem Merge echt multi-arch gebaut und
#     getestet werden koennen.
#   - pull_request (v1.15.0): feuert NUR pr-build — ein amd64-Build ohne Push
#     pro PR, damit Dockerfile-/Stage-Brueche schon im Review auffallen und
#     nicht erst nach dem Merge. build-and-push bleibt via `if` fuer
#     pull_request-Events gesperrt (kein Login, kein Push aus einem PR).
#
# Test-then-Promote (v1.15.0): build-and-push pushed NUR den immutablen Tag
# (<Datum>-<shortsha>). Erst nachdem test-image das Image auf amd64 UND arm64
# smoke-getestet hat, vergibt der promote-Job die beweglichen Kanaele
# (main/latest/semver) per `docker buildx imagetools create`. Ein Image, das
# auf einer Architektur nicht startet, kann so nie unter `latest` landen —
# vorher war `latest` Sekunden nach dem Build oeffentlich, und Self-Hoster
# mit automatischem Pull zogen es sich ungefragt.
on:
  pull_request:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches:
      - main
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v1.0.0)'
        required: false
        default: 'latest'

env:
  REGISTRY: docker.io
  IMAGE_NAME: keeplocal

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # PR-Vollpruefung des Dockerfiles (v1.15.0): Bisher testeten PRs nur die
  # Source-Ebenen (Server/Client/Android) — ein Tippfehler im Dockerfile oder
  # eine kaputte Stage fiel erst im Merge-Durchlauf auf (oder gar nicht, weil
  # nur der Verifikations-Dispatch baut). Ein amd64-Build ohne Push faengt das
  # im PR. Kein Login, keine Secrets; arm64 bleibt dem Merge-Build vorbehalten
  # — der QEMU-Doppelbuild pro PR waere reine Runner-Zeit.
  pr-build:
    name: PR Dockerfile check (amd64, no push)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build All-in-One image (no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.allinone
          platforms: linux/amd64
          push: false
          # Kein docker-metadata.sh hier: Das Skript verlangt Pflicht-Variablen
          # (GITHUB_REF_TYPE etc.), die bei pull_request-Events leer sind und
          # wuerde den Job sofort abbrechen. APP_VERSION=pr-<Nummer> genuegt.
          build-args: |
            APP_VERSION=pr-${{ github.event.pull_request.number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-and-push:
    runs-on: ubuntu-latest
    # Multi-Arch (QEMU-arm64) mit frischem npm-ci-Layer braucht je nach Runner-
    # Auslastung deutlich laenger als 45 min — der v1.13.0-Tag-Build starb am
    # 2026-09-22 im Timeout, kurz vor dem Push. 150 min deckt den Worst-Case
    # ab, ohne dem Job ein unbegrenztes Fenster zu geben.
    timeout-minutes: 150
    # Nur veroeffentlichen, wenn die CI desselben Commits erfolgreich war.
    # `workflow_run.event == 'push'` schliesst PR-Laeufe aus, deren head_branch
    # zufaellig main heisst (z. B. Forks). pull_request-Events (seit v1.15.0
    # Trigger dieses Workflows) bedient pr-build — ohne die erste Zeile waere
    # der true-Zweig aktiv und ein PR wuerde publishen.
    if: >-
      github.event_name != 'pull_request' &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main'))
    outputs:
      test-tag: ${{ steps.meta.outputs.test-tag }}
      promote-tags: ${{ steps.meta.outputs.promote-tags }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Bei workflow_run zeigt github.sha auf den Default-Branch-Stand des
          # Workflows, nicht auf den Commit des ausgeloesten Laufs.
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.ref }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          INPUT_VERSION: ${{ inputs.version }}
          # Der gebaute Commit muss in Label und immutablem Tag stehen, nicht
          # der (bei workflow_run andere) Default-Branch-Sha.
          GITHUB_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          GITHUB_REF_NAME: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || github.ref_name }}
          GITHUB_REF_TYPE: ${{ github.event_name == 'workflow_run' && 'branch' || github.ref_type }}
        run: .github/scripts/docker-metadata.sh

      # Test-then-Promote: NUR der immutable Tag (publish-tags) — die
      # beweglichen Kanaele vergibt der promote-Job nach bestandenem
      # test-image. APP_VERSION landet via Dockerfile-ARG in
      # /app/server/VERSION und damit in /api/health und der Root-Route.
      - name: Build and push All-in-One Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.allinone
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.publish-tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update Docker Hub description
        # Branch-Verifikations-Builds (Nr. 29) aktualisieren die oeffentliche
        # Beschreibung nicht — die folgt erst dem gemergten main.
        if: github.event_name != 'workflow_dispatch' || github.ref_name == 'main'
        uses: peter-evans/dockerhub-description@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
          short-description: "KeepLocal - Self-hosted Google Keep alternative"
          readme-filepath: ./README.md

  test-image:
    needs: build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        architecture:
          - amd64
          - arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Generate JWT Secret
        id: jwt
        run: echo "secret=$(openssl rand -base64 32)" >> $GITHUB_OUTPUT

      - name: Pull and run ${{ matrix.architecture }} Docker image
        run: |
          docker pull \
            --platform "linux/${{ matrix.architecture }}" \
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ needs.build-and-push.outputs.test-tag }}

          docker run -d \
            --name keeplocal-test \
            --platform "linux/${{ matrix.architecture }}" \
            -p 3000:80 \
            -e JWT_SECRET="${{ steps.jwt.outputs.secret }}" \
            -e ALLOWED_ORIGINS="http://localhost:3000" \
            -e NODE_ENV="production" \
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ needs.build-and-push.outputs.test-tag }}

      - name: Wait for services to start
        run: |
          echo "Waiting for services to start..."
          sleep 20

      - name: Check container logs
        run: |
          echo "=== Container Logs ==="
          docker logs keeplocal-test

      # .dockerignore ist nur die halbe Wahrheit: Dieser Schritt prüft das
      # fertige Image. Er schlägt an, wenn jemand den Build-Kontext wieder
      # aufweicht (Host-node_modules, server/.env, lokale Test-Uploads).
      - name: Assert no host artifacts are baked into the image
        run: |
          docker exec keeplocal-test sh -c '
            set -eu
            echo "--- .env Dateien unter /app ---"
            found_env=$(find /app -maxdepth 4 -name ".env*" -not -name ".env.example" | wc -l)
            echo "count=$found_env"
            [ "$found_env" = "0" ]

            echo "--- Nutzer-Uploads im Image ---"
            found_uploads=$(find /app/server/uploads -type f ! -name ".gitkeep" 2>/dev/null | wc -l)
            echo "count=$found_uploads"
            [ "$found_uploads" = "0" ]

            echo "--- Host-node_modules / eigene Test-Dateien ---"
            [ ! -d /app/client/node_modules ]
            # node_modules wird ausgeklammert: Drittpakete liefern eigene
            # *.test.js mit (z. B. fast-uri), das sind keine Host-Artefakte.
            found_tests=$(find /app -path "*/node_modules" -prune -o \( -name "*.test.js" -o -name "test_*.py" \) -print | wc -l)
            echo "count=$found_tests"
            [ "$found_tests" = "0" ]
            [ ! -e /app/ai/test_app.py ]
            found_server_tests=$(find /app/server/tests -type f 2>/dev/null | wc -l)
            echo "server/tests files=$found_server_tests"
            [ "$found_server_tests" = "0" ]

            echo "OK: Image enthält keine Host-Artefakte"
          '

      - name: Test health endpoint
        run: |
          echo "Testing health endpoint..."
          max_attempts=36
          attempt=0

          while [ $attempt -lt $max_attempts ]; do
            if curl -f http://localhost:3000/api/health; then
              echo "Health check passed!"
              exit 0
            fi
            attempt=$((attempt + 1))
            echo "Attempt $attempt/$max_attempts failed, retrying in 5s..."
            sleep 5
          done

          echo "Health check failed after $max_attempts attempts"
          docker logs keeplocal-test
          exit 1

      - name: Test AI health endpoint
        run: |
          echo "Testing AI health endpoint..."
          max_attempts=60
          attempt=0

          while [ $attempt -lt $max_attempts ]; do
            if docker exec keeplocal-test curl -f http://127.0.0.1:5001/health; then
              echo "AI health check passed!"
              exit 0
            fi
            attempt=$((attempt + 1))
            echo "Attempt $attempt/$max_attempts failed, retrying in 5s..."
            sleep 5
          done

          echo "AI health check failed after $max_attempts attempts"
          docker logs keeplocal-test
          exit 1

      - name: Test WebUI
        run: |
          echo "Testing WebUI..."
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/)

          if [ "$HTTP_CODE" = "200" ]; then
            echo "WebUI accessible (HTTP $HTTP_CODE)"
          else
            echo "WebUI not accessible (HTTP $HTTP_CODE)"
            docker logs keeplocal-test
            exit 1
          fi

      # Bisher war hier Schluss: `sleep` + vier Curls. Die Playwright-Suite des
      # Repos lief nur gegen den Source-Build, nie gegen das, was Self-Hoster
      # ausführen (nginx-Routing/CSP/Body-Size, supervisord, All-in-One-Start,
      # Entrypoint, gebautes Bundle). Chromium unter qemu-arm64-Emulation ist zu
      # langsam und flaky, deshalb nur amd64.
      - name: Install Playwright Chromium (amd64 only)
        if: matrix.architecture == 'amd64'
        working-directory: client
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run the smoke suite against the published image
        if: matrix.architecture == 'amd64'
        working-directory: client
        env:
          IMAGE_BASE_URL: http://localhost:3000
          CI: true
        run: npm run test:e2e:image

      - name: Upload image smoke report
        if: failure() && matrix.architecture == 'amd64'
        uses: actions/upload-artifact@v4
        with:
          name: image-smoke-report-${{ matrix.architecture }}
          path: |
            client/playwright-report
            client/test-results
          retention-days: 7
          if-no-files-found: ignore

      - name: Cleanup
        if: always()
        run: |
          docker stop keeplocal-test || true
          docker rm keeplocal-test || true

  # Test-then-Promote (v1.15.0): Erst wenn BEIDE Architekturen des Images
  # smoke-getestet sind, werden die beweglichen Kanaele (main/latest/semver)
  # auf den bereits gepushten immutable Tag gelegt. `imagetools create -t`
  # erzeugt einen neuen Tag, der auf dieselbe Multi-Arch-Manifestliste zeigt —
  # ohne Rebuild, ohne abweichende Digests. Branch-Verifikations-Builds
  # liefern promote-tags leer und ueberspringen diesen Job komplett.
  promote:
    name: Promote tested image
    needs: [build-and-push, test-image]
    if: needs.build-and-push.outputs.promote-tags != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Promote immutable tag to channel tags
        env:
          PROMOTE_TAGS: ${{ needs.build-and-push.outputs.promote-tags }}
          IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
          IMMUTABLE_TAG: ${{ needs.build-and-push.outputs.test-tag }}
        run: |
          set -eu
          echo "Promoting ${IMAGE}:${IMMUTABLE_TAG}:"
          while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            echo "  -> ${tag}"
            docker buildx imagetools create -t "$tag" "${IMAGE}:${IMMUTABLE_TAG}"
          done <<< "$PROMOTE_TAGS"
          echo "All channel tags now point at the tested image."
