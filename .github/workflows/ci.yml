# Führt die kompletten Test-, Lint- und Build-Suiten bei jedem Push und PR aus,
# bevor docker-build.yml ein Image veröffentlicht. Hält den Main-Branch grün,
# damit veröffentlichte Images auf geprüftem Code basieren.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Server (Tests)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        working-directory: server
        run: npm ci

      # Der Upload-Pfad (multer, sharp) verarbeitet angreifer-kontrollierte
      # Bytes: bekannte High-Advisories sollen den Build bremsen, nicht erst im
      # Audit-Bericht eines Self-Hosters auftauchen.
      - name: Audit dependencies
        working-directory: server
        run: npm audit --audit-level=high

      - name: Run tests
        working-directory: server
        run: npm test

  client:
    name: Client (Tests, Lint, Build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        working-directory: client
        run: npm ci

      - name: Audit dependencies
        working-directory: client
        run: npm audit --audit-level=high

      - name: Run tests
        working-directory: client
        run: npm test

      - name: Lint
        working-directory: client
        run: npm run lint

      - name: Build
        working-directory: client
        run: npm run build

  # Android-Unit-Tests (v1.15.0): Der Kotlin/Compose-Client hatte keine CI —
  # Regressionen in SyncManager/PendingOperation/entity-Mappern fielen erst
  # beim manuellen Release-Build auf. Nur testDebugUnitTest (kein assemble):
  # APK-Builds macht der Release-Workflow, hier zaehlen die 243 Unit-Tests.
  # ubuntu-latest bringt das Android-SDK vorinstalliert mit; JDK 17 entspricht
  # jvmTarget/sourceCompatibility in app/build.gradle.kts.
  android:
    name: Android (Unit-Tests)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Run unit tests
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-report
          path: android/app/build/reports/tests/
          retention-days: 7
          if-no-files-found: ignore

  # Die Unit-Suite mockt die Modelle; MongoDB-Semantik ($expr/$size, partielle
  # und TTL-Indizes, Aggregationen, explain(), Unique-Verletzungen) läuft hier
  # gegen eine echte Datenbank — genau dort saßen der COLLSCAN pro Thumbnail und
  # die Papierkorb-Zählungen.
  server-integration:
    name: Server (Integration, real MongoDB)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
          --health-start-period 10s
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        working-directory: server
        run: npm ci

      - name: Run integration tests
        working-directory: server
        env:
          INTEGRATION_MONGODB_URI: mongodb://127.0.0.1:27017/keeplocal_integration
        run: npm run test:integration

  e2e:
    name: E2E (Chromium, production build)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
          --health-start-period 10s
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json

      # The suite runs the real server, so both dependency trees are needed.
      - name: Install server dependencies
        working-directory: server
        run: npm ci

      - name: Install client dependencies
        working-directory: client
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: client
        run: npx playwright install --with-deps chromium

      # Real MongoDB, real server: an installation upgraded from an older image
      # carries indexes whose NAME stayed the same while their options changed
      # (users.provider_1_providerId_1 became unique+partial). createIndex()
      # aborts on that, so the container used to crash-loop right after an
      # update although the data was fine. The check seeds the July index
      # layout, boots the server and asserts the indexes are repaired.
      - name: Upgrade boot check (legacy index layout)
        working-directory: server
        env:
          UPGRADE_MONGODB_URI: mongodb://127.0.0.1:27017/keeplocal_upgrade
        run: npm run verify:upgrade-boot

      # Same reason as the upgrade check: the "last admin" guard has to survive
      # concurrent demotions, and the promote-admin recovery tool has to work —
      # both are only provable against a real MongoDB.
      - name: Admin guard check (no self-lockout, recovery works)
        working-directory: server
        env:
          ADMIN_GUARD_MONGODB_URI: mongodb://127.0.0.1:27017/keeplocal_adminguard
        run: npm run verify:admin-guard

      # The docs promise "test the restore before you need it". This is that
      # test: real MongoDB, real image files, backup -> tamper checks -> drop
      # everything -> restore -> compare documents and checksums.
      - name: Backup/restore round trip (real MongoDB)
        working-directory: server
        env:
          BACKUP_MONGODB_URI: mongodb://127.0.0.1:27017/keeplocal_backup
        run: npm run verify:backup-restore

      # npm runs pretest:e2e (production build) and drops the E2E database first.
      - name: Run E2E smoke suite
        working-directory: client
        env:
          E2E_MONGODB_URI: mongodb://127.0.0.1:27017/keeplocal_e2e
          CI: true
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            client/playwright-report
            client/test-results
          retention-days: 7
          if-no-files-found: ignore
