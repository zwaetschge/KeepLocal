# Supervisor configuration for KeepLocal All-in-One Container
# Manages MongoDB, Node.js Backend, AI Service (Whisper), and Nginx

[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
logfile_maxbytes=10MB
logfile_backups=3
pidfile=/var/run/supervisord.pid
loglevel=info

# Alle Programme loggen nach /dev/stdout bzw. /dev/stderr, damit die Zeilen in
# `docker logs`, `docker compose logs`, Unraids Log-Ansicht und jedem Log-Driver
# (journald/Loki/Syslog) landen. Dateien unter /var/log/supervisor/ lagen im
# Container-Layer und starben mit jedem Update — also genau dann, wenn man sie
# braucht. Rotation macht jetzt der Docker-Log-Driver (siehe `logging:` in den
# Compose-Dateien bzw. --log-opt beim manuellen `docker run`), deshalb
# maxbytes=0. `supervisord.log` selbst bleibt eine Datei (supervisord braucht
# sie fuer den eigenen Start).

# MongoDB Service
# mongod laeuft ohne eigenen Log-Datei-Pfad und schreibt damit nach stdout
# (mongod rotiert nur auf Signal; eine Datei im Container-Layer wuerde
# unbegrenzt wachsen und beim Update verschwinden).
[program:mongodb]
command=/usr/bin/mongod --dbpath /data/db --bind_ip 127.0.0.1
autostart=true
autorestart=true
startretries=5
startsecs=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=1
user=mongodb

# AI Service (Whisper Transcription)
[program:ai]
command=/usr/local/bin/gunicorn --bind 127.0.0.1:5001 --workers 1 --timeout 300 app:app
directory=/app/ai
autostart=true
autorestart=true
startretries=5
startsecs=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=2
user=node

# Periodically restore the deliberately isolated public demo account. The
# worker exits cleanly when DEMO_MODE is not enabled.
[program:demo-reset]
command=/usr/bin/node scripts/demoReset.js
directory=/app/server
autostart=true
autorestart=unexpected
exitcodes=0
startretries=5
startsecs=0
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=2
user=node
stopasgroup=true
killasgroup=true

# Node.js Backend Service
[program:nodejs]
command=/usr/bin/node server.js
directory=/app/server
autostart=true
autorestart=true
startretries=5
startsecs=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=3
user=node

# Nginx Service
[program:nginx]
command=/usr/sbin/nginx -g 'daemon off;'
autostart=true
autorestart=true
startretries=5
startsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=4

# Ein FATAL-Prozess darf nicht als „Up" durchgehen: Dieser Listener beendet den
# Container, die Restart-Policy startet ihn neu (Docker verdoppelt die Wartezeit
# pro Fehlschlag), und `docker logs` nennt das Programm. Ohne ihn lief ein
# crashendes Programm endlos, während `docker ps` einen gesunden Container
# zeigte — genau das Muster aus UPGRADE_FIX_2026-09-12.md.
[eventlistener:fatal-exit]
command=/usr/local/bin/keeplocal-fatal-exit.sh
events=PROCESS_STATE_FATAL
priority=1000
# Eventlistener sprechen über stdout mit supervisord — das Protokoll darf nicht
# zusätzlich in eine Datei gespiegelt werden. Fehler gehen nach stderr.
stdout_logfile=/dev/null
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

# Group all services together
[group:keeplocal]
programs=mongodb,ai,demo-reset,nodejs,nginx
priority=999
