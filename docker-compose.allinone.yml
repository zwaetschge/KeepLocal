services:
  keeplocal:
    build:
      context: .
      dockerfile: Dockerfile.allinone
      args:
        WHISPER_MODEL: ${WHISPER_MODEL:-tiny}
    image: keeplocal-allinone:latest
    container_name: keeplocal-allinone
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "3000:80"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGODB_URI=mongodb://localhost:27017/keeplocal
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET environment variable is required}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-7d}
      - CSRF_SECRET=${CSRF_SECRET:-}
      - COOKIE_SECURE=${COOKIE_SECURE:-}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:3000,http://localhost}
      - TRUST_PROXY=${TRUST_PROXY:-1}
      - HOST=127.0.0.1
      - CLIENT_URL=${CLIENT_URL:-}
      - WHISPER_MODEL=${WHISPER_MODEL:-tiny}
      - MAX_AUDIO_SECONDS=${MAX_AUDIO_SECONDS:-900}
      # Optional: eigenes Shared Secret zwischen node und whisper. Leer lassen
      # erzeugt der Entrypoint pro Container-Start eines (beide Programme erben
      # es ueber denselben Prozessbaum).
      - AI_SERVICE_TOKEN=${AI_SERVICE_TOKEN:-}
      - BACKUP_DIR=/app/server/backups
      # BACKUP_MIN_FREE_MB (v1.16.0): Backup-Lauf verweigert, wenn unter dem
      # Schwellenwert Freiplatz bleibt — seit v1.17.0 auch im Compose-Vertrag.
      - BACKUP_MIN_FREE_MB=${BACKUP_MIN_FREE_MB:-}
      # Betriebs-Variablen (leer = Default der App): Logs, Readiness, Budgets,
      # Papierkorb/Janitor. Dokumentiert in README und .env.example.
      - LOG_LEVEL=${LOG_LEVEL:-}
      - LOG_FORMAT=${LOG_FORMAT:-}
      - REQUIRE_AI_FOR_READY=${REQUIRE_AI_FOR_READY:-}
      - HEALTH_DETAILS=${HEALTH_DETAILS:-}
      - HEALTH_PROBE_TTL_MS=${HEALTH_PROBE_TTL_MS:-}
      - HEALTH_MIN_FREE_MB=${HEALTH_MIN_FREE_MB:-}
      - HEALTH_DISK_FATAL=${HEALTH_DISK_FATAL:-}
      - AI_HEALTH_TIMEOUT_MS=${AI_HEALTH_TIMEOUT_MS:-}
      - LINK_PREVIEW_LIMIT_PER_MINUTE=${LINK_PREVIEW_LIMIT_PER_MINUTE:-}
      - TRANSCRIPTION_LIMIT_PER_HOUR=${TRANSCRIPTION_LIMIT_PER_HOUR:-}
      - TRANSCRIPTION_LIMIT_PER_DAY=${TRANSCRIPTION_LIMIT_PER_DAY:-}
      - TRANSCRIPTION_MINUTES_PER_DAY=${TRANSCRIPTION_MINUTES_PER_DAY:-}
      - MAX_CONCURRENT_TRANSCRIPTIONS=${MAX_CONCURRENT_TRANSCRIPTIONS:-}
      - TRASH_RETENTION_DAYS=${TRASH_RETENTION_DAYS:-}
      - STORAGE_JANITOR_INTERVAL_HOURS=${STORAGE_JANITOR_INTERVAL_HOURS:-}
      - UPLOADS_DIR=/app/server/uploads
      # UPLOAD_QUOTA_MB (v1.16.0): Speicher-Budget pro Konto; 0 = unlimitiert.
      - UPLOAD_QUOTA_MB=${UPLOAD_QUOTA_MB:-}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - GOOGLE_CALLBACK_URL=${GOOGLE_CALLBACK_URL:-}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID:-}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET:-}
      - GITHUB_CALLBACK_URL=${GITHUB_CALLBACK_URL:-}
    volumes:
      # CRITICAL: Map uploads directory to persist images across container restarts
      - uploads_data:/app/server/uploads
      # CRITICAL: Map MongoDB data directory to persist database across container restarts
      - mongodb_data:/data/db
      # Recovery points von scripts/backup.js: ohne Volume liegen sie im
      # Container-Layer und sind nach dem naechsten Update weg.
      - backups_data:/app/server/backups
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/api/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  # Persistent volume for uploaded images and thumbnails
  uploads_data:
    driver: local
  # Persistent volume for MongoDB database
  mongodb_data:
    driver: local
  # Persistent volume for backup recovery points (scripts/backup.js)
  backups_data:
    driver: local
