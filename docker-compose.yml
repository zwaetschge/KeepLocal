services:
  # MongoDB Database
  mongodb:
    image: mongo:7-jammy
    container_name: keeplocal-mongodb
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      MONGO_INITDB_DATABASE: keeplocal
    volumes:
      - mongodb_data:/data/db
    networks:
      - backend
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/keeplocal --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  # AI Service (Whisper Transcription)
  ai:
    build:
      context: ./ai
      dockerfile: Dockerfile
      args:
        WHISPER_MODEL: ${WHISPER_MODEL:-base}
    container_name: keeplocal-ai
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      - WHISPER_MODEL=${WHISPER_MODEL:-base}  # tiny, base, small, medium, large
      # Maximale Audiolänge pro Datei in Sekunden (Nr. 18); längere Aufnahmen
      # lehnt der Dienst mit 413 AUDIO_TOO_LONG ab, bevor das Modell lädt.
      - MAX_AUDIO_SECONDS=${MAX_AUDIO_SECONDS:-900}
      # Shared secret mit dem Server: ohne Token nimmt /transcribe Anfragen von
      # jedem im backend-Netz an. In .env setzen (openssl rand -hex 32).
      - AI_SERVICE_TOKEN=${AI_SERVICE_TOKEN:-}
    networks:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # Backend Server
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: keeplocal-server
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGODB_URI=mongodb://mongodb:27017/keeplocal
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:3000,http://localhost}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET environment variable is required}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-7d}
      - CSRF_SECRET=${CSRF_SECRET:-}
      - COOKIE_SECURE=${COOKIE_SECURE:-}
      - TRUST_PROXY=1
      - AI_SERVICE_URL=http://ai:5000  # AI service endpoint
      - AI_SERVICE_TOKEN=${AI_SERVICE_TOKEN:-}  # muss zum Token des ai-Services passen
      - BACKUP_DIR=/app/backups
      # BACKUP_MIN_FREE_MB (v1.16.0): Backup-Lauf verweigert, wenn unter dem
      # Schwellenwert Freiplatz bleibt — seit v1.17.0 auch im Compose-Vertrag.
      - BACKUP_MIN_FREE_MB=${BACKUP_MIN_FREE_MB:-}
      # Betriebs-Variablen (leer = Default der App): Logs, Readiness, Budgets,
      # Papierkorb/Janitor. Dokumentiert in README und .env.example.
      - LOG_LEVEL=${LOG_LEVEL:-}
      - LOG_FORMAT=${LOG_FORMAT:-}
      - REQUIRE_AI_FOR_READY=${REQUIRE_AI_FOR_READY:-}
      - HEALTH_DETAILS=${HEALTH_DETAILS:-}
      - HEALTH_PROBE_TTL_MS=${HEALTH_PROBE_TTL_MS:-}
      - HEALTH_MIN_FREE_MB=${HEALTH_MIN_FREE_MB:-}
      - HEALTH_DISK_FATAL=${HEALTH_DISK_FATAL:-}
      - AI_HEALTH_TIMEOUT_MS=${AI_HEALTH_TIMEOUT_MS:-}
      - LINK_PREVIEW_LIMIT_PER_MINUTE=${LINK_PREVIEW_LIMIT_PER_MINUTE:-}
      - TRANSCRIPTION_LIMIT_PER_HOUR=${TRANSCRIPTION_LIMIT_PER_HOUR:-}
      - TRANSCRIPTION_LIMIT_PER_DAY=${TRANSCRIPTION_LIMIT_PER_DAY:-}
      - TRANSCRIPTION_MINUTES_PER_DAY=${TRANSCRIPTION_MINUTES_PER_DAY:-}
      - MAX_CONCURRENT_TRANSCRIPTIONS=${MAX_CONCURRENT_TRANSCRIPTIONS:-}
      - TRASH_RETENTION_DAYS=${TRASH_RETENTION_DAYS:-}
      - STORAGE_JANITOR_INTERVAL_HOURS=${STORAGE_JANITOR_INTERVAL_HOURS:-}
      - UPLOADS_DIR=/app/uploads
      # UPLOAD_QUOTA_MB (v1.16.0): Speicher-Budget pro Konto; 0 = unlimitiert.
      - UPLOAD_QUOTA_MB=${UPLOAD_QUOTA_MB:-}
      # OAuth (optional — leave empty to disable)
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - GOOGLE_CALLBACK_URL=${GOOGLE_CALLBACK_URL:-}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID:-}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET:-}
      - GITHUB_CALLBACK_URL=${GITHUB_CALLBACK_URL:-}
      - CLIENT_URL=${CLIENT_URL:-http://localhost:3000}
    volumes:
      - uploads_data:/app/uploads
      # Recovery points von scripts/backup.js muessen auf ein Volume, sonst
      # sterben sie mit dem Container-Layer beim naechsten Update.
      - backups_data:/app/backups
    depends_on:
      mongodb:
        condition: service_healthy
      ai:
        condition: service_healthy
    networks:
      - backend
      - frontend
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:5000/api/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Frontend Client
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: keeplocal-client
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "3000:80"
    depends_on:
      - server
    networks:
      - frontend
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
    internal: true

volumes:
  mongodb_data:
    driver: local
  uploads_data:
    driver: local
  backups_data:
    driver: local
