<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <defs>
    <linearGradient id="klBg" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#D4887D"/>
      <stop offset="100%" stop-color="#B56B55"/>
    </linearGradient>
  </defs>

  <!-- Rounded square brand background -->
  <rect width="48" height="48" rx="11" fill="url(#klBg)"/>

  <!-- Note sheet, rounded corners except the folded top-right -->
  <path
    d="M 15 6.5 H 30 L 38 14.5 V 39 Q 38 42 35 42 H 15 Q 12 42 12 39 V 9.5 Q 12 6.5 15 6.5 Z"
    fill="#FFFFFF"/>

  <!-- Folded corner, oversized so it survives small renderings -->
  <path d="M 30 6.5 V 11.5 Q 30 14.5 33 14.5 H 38 Z" fill="#E7D9C9"/>
  <path d="M 30 14.5 H 33 Q 34.4 13.1 35.1 11.6 L 38 14.5 Z" fill="#000000" opacity="0.08"/>

  <!-- Two bold text lines instead of three thin ones -->
  <line x1="16" y1="18.5" x2="33.5" y2="18.5" stroke="#B56B55" stroke-width="2.7" stroke-linecap="round"/>
  <line x1="16" y1="24"   x2="27"   y2="24"   stroke="#B56B55" stroke-width="2.7" stroke-linecap="round" opacity="0.55"/>

  <!-- Check badge breaking out of the sheet's bottom-right corner -->
  <circle cx="31.5" cy="36.5" r="5.4" fill="#B56B55"/>
  <circle cx="31.5" cy="36.5" r="5.4" fill="none" stroke="#FFFFFF" stroke-width="1.1" opacity="0.35"/>
  <path d="M 29.1 36.6 L 30.8 38.3 L 34.1 34.8" stroke="#FFFFFF" stroke-width="2.1"
        stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
